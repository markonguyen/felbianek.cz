<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nové heslo | Felbiánek Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__mark" aria-hidden="true">F</div>
        <h1>Nové heslo</h1>
        <p>Zvolte si nové heslo k účtu</p>
      </div>

      <div class="alert alert--success alert--hidden" id="done-alert">
        Heslo bylo změněno. Můžete se přihlásit.
        <p style="margin:0.75rem 0 0"><a href="login.html">Přejít na přihlášení</a></p>
      </div>

      <form class="form-stack" id="reset-form">
        <div class="field" id="field-password">
          <label for="password">Nové heslo</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Nejméně 6 znaků">
          <span class="field-error">Heslo musí mít alespoň 6 znaků.</span>
        </div>
        <div class="field" id="field-confirm">
          <label for="confirm">Potvrzení hesla</label>
          <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
          <span class="field-error">Hesla se neshodují.</span>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Uložit heslo</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Zpět na přihlášení</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById("reset-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const passField = document.getElementById("field-password");
      const confirmField = document.getElementById("field-confirm");
      const password = document.getElementById("password");
      const confirm = document.getElementById("confirm");
      let ok = true;

      passField.classList.toggle("is-invalid", password.value.length < 6);
      if (password.value.length < 6) ok = false;

      confirmField.classList.toggle("is-invalid", password.value !== confirm.value || !confirm.value);
      if (password.value !== confirm.value || !confirm.value) ok = false;

      if (!ok) return;
      document.getElementById("done-alert").classList.remove("alert--hidden");
      document.getElementById("reset-form").style.display = "none";
    });
  </script>
</body>
</html>
