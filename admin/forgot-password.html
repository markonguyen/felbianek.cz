<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapomenuté heslo | Felbiánek Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__mark" aria-hidden="true">F</div>
        <h1>Zapomenuté heslo</h1>
        <p>Pošleme vám odkaz pro nastavení nového hesla</p>
      </div>

      <div class="alert alert--success alert--hidden" id="sent-alert">
        Pokud účet s tímto e-mailem existuje, odeslali jsme odkaz pro obnovení hesla.
        <p style="margin:0.75rem 0 0">
          <a href="reset-password.html?token=demo">Pokračovat na nastavení hesla</a>
          <span class="list-meta"> (v prototypu bez skutečného e-mailu)</span>
        </p>
      </div>

      <form class="form-stack" id="forgot-form">
        <div class="field" id="field-email">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="vas@email.cz" autocomplete="email">
          <span class="field-error">Zadejte platný e-mail.</span>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Odeslat odkaz</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Zpět na přihlášení</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const field = document.getElementById("field-email");
      const email = document.getElementById("email");
      field.classList.toggle("is-invalid", !email.validity.valid);
      if (!email.validity.valid) return;
      document.getElementById("sent-alert").classList.remove("alert--hidden");
      document.getElementById("forgot-form").style.display = "none";
    });
  </script>
</body>
</html>
