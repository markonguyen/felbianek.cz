<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koš | Felbiánek Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="app">
  <div id="admin-shell">
    <div class="page-header">
      <div>
        <h2>Koš</h2>
        <p>Smazané novinky můžete obnovit nebo smazat natrvalo.</p>
      </div>
    </div>

    <div class="alert alert--info alert--hidden" id="trash-alert"></div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data" id="trash-table">
          <thead>
            <tr>
              <th>Název</th>
              <th>Smazáno</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty alert--hidden" id="empty-trash">
        <p>Koš je prázdný.</p>
      </div>
    </section>
  </div>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/nav.js"></script>
  <script>
    AdminShell.init({ active: "kos", title: "Koš" });

    function render() {
      const items = AdminMock.trashedNews();
      const tbody = document.querySelector("#trash-table tbody");
      const table = document.getElementById("trash-table");
      const empty = document.getElementById("empty-trash");
      tbody.innerHTML = "";

      if (!items.length) {
        table.style.display = "none";
        empty.classList.remove("alert--hidden");
        return;
      }

      table.style.display = "";
      empty.classList.add("alert--hidden");

      items.forEach((n) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${n.title}</strong></td>
          <td class="list-meta">${AdminMock.formatDate(n.deletedAt)}</td>
          <td class="actions">
            <button type="button" class="btn btn--secondary btn--sm" data-restore="${n.id}">Obnovit</button>
            <button type="button" class="btn btn--danger-outline btn--sm" data-purge="${n.id}">Smazat natrvalo</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    render();

    document.querySelector("#trash-table tbody").addEventListener("click", (e) => {
      const restoreId = e.target.getAttribute("data-restore");
      const purgeId = e.target.getAttribute("data-purge");
      const alert = document.getElementById("trash-alert");

      if (restoreId) {
        const item = AdminMock.news.find((n) => n.id === restoreId);
        if (item) {
          item.deletedAt = null;
          alert.textContent = "Novinka obnovena (prototyp).";
          alert.classList.remove("alert--hidden");
          render();
        }
      }

      if (purgeId) {
        if (!confirm("Opravdu smazat natrvalo? Tuto akci nelze vrátit.")) return;
        const idx = AdminMock.news.findIndex((n) => n.id === purgeId);
        if (idx >= 0) {
          AdminMock.news.splice(idx, 1);
          alert.textContent = "Novinka smazána natrvalo (prototyp).";
          alert.classList.remove("alert--hidden");
          render();
        }
      }
    });
  </script>
</body>
</html>
