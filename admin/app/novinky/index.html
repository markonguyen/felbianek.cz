<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novinky | Felbiánek Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body class="app">
  <div id="admin-shell">
    <div id="page-actions">
      <a class="btn btn--primary btn--sm" href="edit.html">Nová novinka</a>
    </div>

    <div class="page-header">
      <div>
        <h2>Novinky</h2>
        <p>Aktuality zobrazované na webu. Editor je může rovnou zveřejnit.</p>
      </div>
    </div>

    <section class="panel">
      <div class="table-wrap">
        <table class="data" id="news-table">
          <thead>
            <tr>
              <th>Název</th>
              <th>Štítek</th>
              <th>Stav</th>
              <th>Datum</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty alert--hidden" id="empty-state">
        <p>Zatím tu žádná novinka není.</p>
        <a class="btn btn--primary" href="edit.html">Přidej první novinku</a>
      </div>
    </section>
  </div>

  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/nav.js"></script>
  <script>
    AdminShell.init({ active: "novinky", title: "Novinky", wide: true });

    const tbody = document.querySelector("#news-table tbody");
    const table = document.getElementById("news-table");
    const empty = document.getElementById("empty-state");

    function render() {
      const items = AdminMock.activeNews();
      tbody.innerHTML = "";
      if (!items.length) {
        table.style.display = "none";
        empty.classList.remove("alert--hidden");
        return;
      }
      table.style.display = "";
      empty.classList.add("alert--hidden");
      items.forEach((n) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${n.title}</strong></td>
          <td>${n.badge || "—"}</td>
          <td><span class="badge badge--${n.status}">${AdminMock.statusLabel(n.status)}</span></td>
          <td class="list-meta">${AdminMock.formatDate(n.publishedAt)}</td>
          <td class="actions">
            <a class="btn btn--ghost btn--sm" href="edit.html?id=${n.id}">Upravit</a>
            <button type="button" class="btn btn--ghost btn--sm" data-toggle="${n.id}">${n.status === "published" ? "Skrýt" : "Zveřejnit"}</button>
            <button type="button" class="btn btn--ghost btn--sm" data-trash="${n.id}">Do koše</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    render();

    tbody.addEventListener("click", (e) => {
      const trashId = e.target.getAttribute("data-trash");
      const toggleId = e.target.getAttribute("data-toggle");
      if (trashId) {
        const item = AdminMock.news.find((n) => n.id === trashId);
        if (item && confirm("Přesunout novinku do koše?")) {
          item.deletedAt = new Date().toISOString().slice(0, 10);
          render();
        }
      }
      if (toggleId) {
        const item = AdminMock.news.find((n) => n.id === toggleId);
        if (item) {
          item.status = item.status === "published" ? "draft" : "published";
          render();
        }
      }
    });
  </script>
</body>
</html>
